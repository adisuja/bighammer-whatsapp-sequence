<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigHammer.ai · WhatsApp messages · iOS preview</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="core.css?v=2">
<link rel="stylesheet" href="whatsapp.css?v=2">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark wa-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8c.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg></span>
    <div>
      <div class="brand-title">BigHammer.ai · WhatsApp messages</div>
      <div class="brand-sub">Every message rendered as the recipient sees it in the WhatsApp iOS app</div>
    </div>
  </div>
  <div class="controls">
    <div class="seg" title="The open chat, or the chat-list row the message creates">
      <button data-set="view" data-val="chat" class="on">Chat</button>
      <button data-set="view" data-val="list">Chat list</button>
    </div>
    <div class="seg" title="Show sample merge values or the raw {{tokens}}">
      <button data-set="mode" data-val="sample" class="on">Sample data</button>
      <button data-set="mode" data-val="raw">{{tokens}}</button>
    </div>
    <label class="tgl" title="WhatsApp unfurls the first link in a message into a preview card"><input type="checkbox" data-set="preview" checked><span>Link previews</span></label>
    <div class="seg" title="Phone size">
      <button data-set="scale" data-val="1">100%</button>
      <button data-set="scale" data-val="0.85" class="on">85%</button>
      <button data-set="scale" data-val="0.7">70%</button>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="sidenav" id="sidenav" aria-label="Messages"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast">Copied</div>
<script src="core.js?v=2"></script>
<script src="whatsapp.js?v=2"></script>
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
